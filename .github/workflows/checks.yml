name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Cambiar a npm ci cuando se genere y revise package-lock.json.
      - run: npm install
      - name: Export lockfile for repository synchronization
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {gzipSync} from 'node:zlib';
          const encoded=gzipSync(readFileSync('package-lock.json')).toString('base64');
          for(let i=0;i<encoded.length;i+=6000) console.log('SAI_LOCK_'+i+':'+encoded.slice(i,i+6000));
          JS
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Dependency audit report
        continue-on-error: true
        run: npm audit --json
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-disposable-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Supabase-compatible roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema extensions;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          grant usage on schema public,extensions to anon,authenticated,service_role;
          SQL
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/001_secure_rooms.sql
      - name: Verify persistence and private access
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/integration.sql
